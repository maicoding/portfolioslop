<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridBlob Tool</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --accent: #ff5500;
      --accent-soft: rgba(255, 85, 0, 0.14);
      --paper: #ffffff;
      --ink: #101010;
      --muted: #77716a;
      --stage: #ece7e1;
      --shadow: 0 24px 64px rgba(16, 16, 16, 0.12);
      --font-display: "Arial Black", "Arial Narrow", Arial, sans-serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.95), transparent 34%),
        linear-gradient(135deg, #efeae4 0%, #ddd7d0 100%);
      color: var(--ink);
      font-family: var(--font-body);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(16, 16, 16, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(160deg, #ff6e1e 0%, #ff5500 100%);
      color: white;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 28px rgba(255, 85, 0, 0.26);
      flex-shrink: 0;
    }

    .brand-copy h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .brand-copy p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .button,
    .link-button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: transform 140ms ease, background 140ms ease, color 140ms ease, border-color 140ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .button:hover,
    .link-button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: var(--ink);
      color: white;
    }

    .button-secondary {
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
    }

    .button-ghost,
    .link-button {
      background: rgba(16, 16, 16, 0.06);
      color: var(--ink);
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.72);
      border-right: 1px solid rgba(16, 16, 16, 0.08);
      padding: 26px 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .field-head span:last-child {
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      appearance: none;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 85, 0, 0.2), rgba(16, 16, 16, 0.06));
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid white;
      box-shadow: 0 4px 12px rgba(16, 16, 16, 0.2);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid white;
      box-shadow: 0 4px 12px rgba(16, 16, 16, 0.2);
      cursor: pointer;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      border: 2px solid transparent;
      background: rgba(16, 16, 16, 0.04);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 140ms ease;
    }

    .toggle.is-active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tip {
      padding: 18px;
      border-radius: 22px;
      background: #111111;
      color: white;
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .tip strong {
      display: inline-block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .tip span {
      color: var(--accent);
      font-weight: 800;
    }

    .clear-button {
      justify-content: center;
      color: #6d655d;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 3vw, 42px);
      min-height: 0;
      overflow: auto;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.35) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px),
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8), transparent 26%),
        linear-gradient(180deg, #eeebe6 0%, #ded8cf 100%);
      background-size: 32px 32px, 32px 32px, auto, auto;
    }

    .canvas-frame {
      background: var(--paper);
      border-radius: 10px;
      box-shadow: var(--shadow);
      line-height: 0;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid rgba(16, 16, 16, 0.08);
      }
    }

    @media (max-width: 720px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .topbar-actions {
        justify-content: stretch;
      }

      .topbar-actions > * {
        flex: 1 1 140px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>Grid<span style="color: var(--accent);">Blob</span></h1>
          <p>Standalone Blob Generator</p>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="export-png" class="button button-primary" type="button">PNG Export</button>
        <button id="export-svg" class="button button-secondary" type="button">SVG Export</button>
        <a class="link-button" href="/">Zurueck zum Portfolio</a>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="panel">
          <h2 class="panel-title">Parameter</h2>

          <label class="field">
            <div class="field-head">
              <span>Breite</span>
              <span id="cols-value">10</span>
            </div>
            <input id="cols" type="range" min="2" max="35" value="10">
          </label>

          <label class="field">
            <div class="field-head">
              <span>Hoehe</span>
              <span id="rows-value">6</span>
            </div>
            <input id="rows" type="range" min="2" max="25" value="6">
          </label>

          <label class="field">
            <div class="field-head">
              <span>Zoom</span>
              <span id="cell-size-value">60px</span>
            </div>
            <input id="cell-size" type="range" min="20" max="150" value="60">
          </label>
        </section>

        <section class="panel">
          <h2 class="panel-title">Ansicht</h2>
          <button id="grid-toggle" class="toggle is-active" type="button">
            <span>Hilfslinien <span id="grid-toggle-state">AN</span></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3h18v18H3z"></path>
              <path d="M9 3v18"></path>
              <path d="M15 3v18"></path>
              <path d="M3 9h18"></path>
              <path d="M3 15h18"></path>
            </svg>
          </button>
        </section>

        <section class="sidebar-footer">
          <button id="clear" class="button button-ghost clear-button" type="button">Leinwand leeren</button>
          <div class="tip">
            <strong>Pro Tipp</strong><br>
            Klicke auf <span>Kreise</span> fuer Punkte und auf <span>Kreuzungen</span> fuer Verbindungen. Exportiert werden nur die schwarzen Formen auf transparentem Hintergrund.
          </div>
        </section>
      </aside>

      <section class="stage">
        <div class="canvas-frame">
          <canvas id="blob-canvas"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    const MAX_COLS = 40;
    const MAX_ROWS = 30;
    const PREVIEW_PADDING = 40;

    const state = {
      cols: 10,
      rows: 6,
      cellSize: 60,
      showGrid: true,
      gridCells: Array.from({ length: MAX_COLS }, () => Array(MAX_ROWS).fill(0)),
      gridGaps: Array.from({ length: MAX_COLS + 1 }, () => Array(MAX_ROWS + 1).fill(0)),
      hovering: { type: null, x: 0, y: 0 }
    };

    const canvas = document.getElementById('blob-canvas');
    const ctx = canvas.getContext('2d');

    const colsInput = document.getElementById('cols');
    const rowsInput = document.getElementById('rows');
    const cellSizeInput = document.getElementById('cell-size');
    const colsValue = document.getElementById('cols-value');
    const rowsValue = document.getElementById('rows-value');
    const cellSizeValue = document.getElementById('cell-size-value');
    const gridToggle = document.getElementById('grid-toggle');
    const gridToggleState = document.getElementById('grid-toggle-state');
    const clearButton = document.getElementById('clear');
    const exportPngButton = document.getElementById('export-png');
    const exportSvgButton = document.getElementById('export-svg');

    function cloneMatrix(matrix) {
      return matrix.map((column) => [...column]);
    }

    function updateLabels() {
      colsValue.textContent = String(state.cols);
      rowsValue.textContent = String(state.rows);
      cellSizeValue.textContent = `${state.cellSize}px`;
      gridToggle.classList.toggle('is-active', state.showGrid);
      gridToggleState.textContent = state.showGrid ? 'AN' : 'AUS';
    }

    function clearPreview() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function renderToContext(targetCtx, isExport = false) {
      const width = state.cols * state.cellSize;
      const height = state.rows * state.cellSize;
      const padding = isExport ? 0 : PREVIEW_PADDING;

      if (!isExport) {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round((width + padding * 2) * dpr);
        canvas.height = Math.round((height + padding * 2) * dpr);
        canvas.style.width = `${width + padding * 2}px`;
        canvas.style.height = `${height + padding * 2}px`;
        targetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      targetCtx.clearRect(0, 0, width + padding * 2, height + padding * 2);
      targetCtx.translate(padding, padding);
      targetCtx.fillStyle = '#000000';

      for (let x = 0; x <= state.cols; x += 1) {
        for (let y = 0; y <= state.rows; y += 1) {
          if (state.gridGaps[x]?.[y] === 1) {
            const gx = x * state.cellSize;
            const gy = y * state.cellSize;
            targetCtx.fillRect(gx - state.cellSize / 2, gy - state.cellSize / 2, state.cellSize, state.cellSize);
          }
        }
      }

      for (let x = 0; x < state.cols; x += 1) {
        for (let y = 0; y < state.rows; y += 1) {
          if (state.gridCells[x]?.[y] === 1) {
            const cx = x * state.cellSize + state.cellSize / 2;
            const cy = y * state.cellSize + state.cellSize / 2;
            targetCtx.beginPath();
            targetCtx.arc(cx, cy, state.cellSize / 2 + 0.3, 0, Math.PI * 2);
            targetCtx.fill();
          }
        }
      }

      targetCtx.globalCompositeOperation = 'destination-out';
      for (let x = 0; x < state.cols; x += 1) {
        for (let y = 0; y < state.rows; y += 1) {
          if (state.gridCells[x]?.[y] === 0) {
            const cx = x * state.cellSize + state.cellSize / 2;
            const cy = y * state.cellSize + state.cellSize / 2;
            targetCtx.beginPath();
            targetCtx.arc(cx, cy, state.cellSize / 2 - 0.3, 0, Math.PI * 2);
            targetCtx.fill();
          }
        }
      }
      targetCtx.globalCompositeOperation = 'source-over';

      if (!isExport) {
        if (state.showGrid) {
          targetCtx.strokeStyle = '#ff5500';
          targetCtx.lineWidth = 0.5;
          for (let x = 0; x < state.cols; x += 1) {
            for (let y = 0; y < state.rows; y += 1) {
              const cx = x * state.cellSize + state.cellSize / 2;
              const cy = y * state.cellSize + state.cellSize / 2;
              targetCtx.beginPath();
              targetCtx.arc(cx, cy, state.cellSize / 2, 0, Math.PI * 2);
              targetCtx.stroke();
            }
          }
        }

        if (state.hovering.type) {
          targetCtx.fillStyle = 'rgba(255, 85, 0, 0.3)';
          if (state.hovering.type === 'cell') {
            const cx = state.hovering.x * state.cellSize + state.cellSize / 2;
            const cy = state.hovering.y * state.cellSize + state.cellSize / 2;
            targetCtx.beginPath();
            targetCtx.arc(cx, cy, state.cellSize / 2, 0, Math.PI * 2);
            targetCtx.fill();
          } else {
            const gx = state.hovering.x * state.cellSize;
            const gy = state.hovering.y * state.cellSize;
            targetCtx.fillRect(gx - state.cellSize / 2, gy - state.cellSize / 2, state.cellSize, state.cellSize);
          }
        }
      }
    }

    function draw() {
      clearPreview();
      renderToContext(ctx, false);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function setHover(type = null, x = 0, y = 0) {
      state.hovering = { type, x, y };
      draw();
    }

    function handleInteraction(event, isClick = false) {
      const rect = canvas.getBoundingClientRect();
      const mx = event.clientX - rect.left - PREVIEW_PADDING;
      const my = event.clientY - rect.top - PREVIEW_PADDING;

      const gx = mx / state.cellSize;
      const gy = my / state.cellSize;

      const cellIX = Math.floor(gx);
      const cellIY = Math.floor(gy);
      const gapIX = Math.round(gx);
      const gapIY = Math.round(gy);

      const distToCell = Math.hypot(
        mx - (cellIX * state.cellSize + state.cellSize / 2),
        my - (cellIY * state.cellSize + state.cellSize / 2)
      );
      const distToGap = Math.hypot(
        mx - gapIX * state.cellSize,
        my - gapIY * state.cellSize
      );

      if (distToCell < distToGap) {
        if (cellIX >= 0 && cellIX < state.cols && cellIY >= 0 && cellIY < state.rows) {
          if (isClick) {
            const next = cloneMatrix(state.gridCells);
            next[cellIX][cellIY] = next[cellIX][cellIY] ? 0 : 1;
            state.gridCells = next;
            draw();
          } else {
            setHover('cell', cellIX, cellIY);
          }
        } else if (!isClick) {
          setHover();
        }
        return;
      }

      if (gapIX >= 0 && gapIX <= state.cols && gapIY >= 0 && gapIY <= state.rows) {
        if (isClick) {
          const next = cloneMatrix(state.gridGaps);
          next[gapIX][gapIY] = next[gapIX][gapIY] ? 0 : 1;
          state.gridGaps = next;
          draw();
        } else {
          setHover('gap', gapIX, gapIY);
        }
      } else if (!isClick) {
        setHover();
      }
    }

    function resetGrid() {
      state.gridCells = Array.from({ length: MAX_COLS }, () => Array(MAX_ROWS).fill(0));
      state.gridGaps = Array.from({ length: MAX_COLS + 1 }, () => Array(MAX_ROWS + 1).fill(0));
      state.hovering = { type: null, x: 0, y: 0 };
      draw();
    }

    function exportPNG() {
      const width = state.cols * state.cellSize;
      const height = state.rows * state.cellSize;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = width;
      tempCanvas.height = height;
      const tempCtx = tempCanvas.getContext('2d');

      renderToContext(tempCtx, true);

      const link = document.createElement('a');
      link.download = `gridblob-${Date.now()}.png`;
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    }

    function exportSVG() {
      const width = state.cols * state.cellSize;
      const height = state.rows * state.cellSize;

      let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;
      svg += '<defs><mask id="gridblob-mask">';
      svg += '<rect width="100%" height="100%" fill="white" />';
      for (let x = 0; x < state.cols; x += 1) {
        for (let y = 0; y < state.rows; y += 1) {
          if (state.gridCells[x]?.[y] === 0) {
            svg += `<circle cx="${x * state.cellSize + state.cellSize / 2}" cy="${y * state.cellSize + state.cellSize / 2}" r="${state.cellSize / 2 - 0.3}" fill="black" />`;
          }
        }
      }
      svg += '</mask></defs>';
      svg += '<g mask="url(#gridblob-mask)" fill="black">';

      for (let x = 0; x <= state.cols; x += 1) {
        for (let y = 0; y <= state.rows; y += 1) {
          if (state.gridGaps[x]?.[y] === 1) {
            svg += `<rect x="${x * state.cellSize - state.cellSize / 2}" y="${y * state.cellSize - state.cellSize / 2}" width="${state.cellSize}" height="${state.cellSize}" />`;
          }
        }
      }

      for (let x = 0; x < state.cols; x += 1) {
        for (let y = 0; y < state.rows; y += 1) {
          if (state.gridCells[x]?.[y] === 1) {
            svg += `<circle cx="${x * state.cellSize + state.cellSize / 2}" cy="${y * state.cellSize + state.cellSize / 2}" r="${state.cellSize / 2 + 0.3}" />`;
          }
        }
      }

      svg += '</g></svg>';

      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `gridblob-${Date.now()}.svg`;
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    colsInput.addEventListener('input', (event) => {
      state.cols = Number.parseInt(event.target.value, 10);
      updateLabels();
      draw();
    });

    rowsInput.addEventListener('input', (event) => {
      state.rows = Number.parseInt(event.target.value, 10);
      updateLabels();
      draw();
    });

    cellSizeInput.addEventListener('input', (event) => {
      state.cellSize = Number.parseInt(event.target.value, 10);
      updateLabels();
      draw();
    });

    gridToggle.addEventListener('click', () => {
      state.showGrid = !state.showGrid;
      updateLabels();
      draw();
    });

    clearButton.addEventListener('click', resetGrid);
    exportPngButton.addEventListener('click', exportPNG);
    exportSvgButton.addEventListener('click', exportSVG);

    canvas.addEventListener('mousemove', (event) => handleInteraction(event, false));
    canvas.addEventListener('mousedown', (event) => handleInteraction(event, true));
    canvas.addEventListener('mouseleave', () => setHover());

    window.addEventListener('resize', draw);

    updateLabels();
    draw();
  </script>
  <script type="module" src="/src/i18n.js"></script>
</body>
</html>

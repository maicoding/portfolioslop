<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claudia Mai</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta
    name="description"
    content="Claudia Mai: Portfolio und postdigitales Projekt." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/entry-gateway.css" />
</head>

<body>
  <div class="gateway-noise" aria-hidden="true"></div>

  <main class="gateway-shell">
    <section class="gateway-stage">
      <div class="gateway-identity">
        <p class="gateway-micro">Claudia Mai</p>
        <h1 class="gateway-wordmark">
          <span>CLAUDIA</span>
          <span>MAI</span>
        </h1>
        <div class="gateway-contact">
          <a href="mailto:clmai@me.com">clmai@me.com</a>
        </div>
      </div>

      <section class="gateway-selection" aria-label="Auswahl">
        <a class="gateway-tile gateway-tile--portfolio" href="/portfolio.html">
          <div class="gateway-tile__head">
            <span class="gateway-tile__number">01</span>
            <span class="gateway-micro">Portfolio</span>
          </div>

          <div class="gateway-tile__media gateway-tile__media--portrait">
            <img
              src="/post-everything-gallery/posteverything01.png"
              alt="Vorschau aus Post Everything" />
          </div>

          <div class="gateway-tile__body">
            <h2>Portfolio</h2>
            <p>Projekte, Lehre, Tools.</p>
          </div>

          <span class="gateway-tile__footer">Open</span>
        </a>

        <a class="gateway-tile gateway-tile--postdigital" href="/postdigital.html">
          <div class="gateway-tile__head">
            <span class="gateway-tile__number">02</span>
            <span class="gateway-micro">Postdigital</span>
          </div>

          <div class="gateway-tile__media gateway-tile__media--landscape">
            <img
              src="/3d-vr/forestrender.png"
              alt="Surreale 3D-Szene als Vorschau" />
          </div>

          <div class="gateway-tile__body">
            <h2>Postdigital</h2>
            <p>Experimentelle Gegenfassung.</p>
          </div>

          <span class="gateway-tile__footer">Enter</span>
        </a>
      </section>
    </section>
  </main>
  <script type="module" src="/src/i18n.js"></script>
</body>

</html>

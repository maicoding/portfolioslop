<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Font Lab v3.9</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap');

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #08080a;
      color: #f0f0f0;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
      width: 100vw;
    }

    .sidebar {
      background-color: #0c0c0f;
      border-right: 1px solid #1f1f25;
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      z-index: 10;
    }

    .main-workspace {
      padding: 2.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      background: radial-gradient(circle at 30% 30%, #121216 0%, #08080a 100%);
    }

    .font-preview {
      font-size: 80px;
      line-height: 1.1;
      flex-grow: 1;
      border: 1px solid #1f1f25;
      padding: 3rem;
      border-radius: 32px;
      background: #050505;
      white-space: pre-wrap;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      min-height: 400px;
      overflow-y: auto;
    }

    input[type="range"] {
      accent-color: #ff3e00;
      height: 4px;
    }

    .sidebar::-webkit-scrollbar,
    .font-preview::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar::-webkit-scrollbar-thumb,
    .font-preview::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff3e00, #ff8a00);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 62, 0, 0.4);
    }

    .setting-card {
      background: #16161c;
      border: 1px solid #25252b;
      padding: 16px;
      border-radius: 18px;
    }

    .tool-back {
      display: inline-flex;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9f9fa9;
      text-decoration: none;
    }

    .tool-back:hover {
      color: #ff8a00;
    }

    @media (max-width: 1024px) {
      .app-layout {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }

      body {
        overflow: auto;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #1f1f25;
        height: auto;
      }

      .font-preview {
        font-size: 48px;
        min-height: 350px;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">

      </div>

        </div>

  <script>
    let currentFont = null;
    let rng;
    let activeFontUrl = null;

    function mulberry32(a) {
      return function () {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß0123456789!?+-=.:,; ";

    const skeletons = {
      'A': [[[100, 900], [500, 100], [900, 900]], [[250, 600], [750, 600]]],
      'B': [[[100, 100], [100, 900]], [[100, 100], [750, 200], [700, 500], [100, 500]], [[100, 500], [850, 600], [800, 900], [100, 900]]],
      'C': [[[850, 250], [250, 150], [150, 500], [250, 850], [850, 750]]],
      'D': [[[150, 100], [150, 900]], [[150, 100], [900, 500], [150, 900]]],
      'E': [[[850, 150], [150, 150], [150, 850], [850, 850]], [[150, 500], [650, 500]]],
      'F': [[[850, 150], [150, 150], [150, 850]], [[150, 500], [700, 500]]],
      'G': [[[850, 300], [850, 150], [150, 150], [150, 850], [850, 850], [850, 550], [550, 550]]],
      'H': [[[150, 100], [150, 900]], [[850, 100], [850, 900]], [[150, 500], [850, 500]]],
      'I': [[[500, 150], [500, 850]], [[300, 150], [700, 150]], [[300, 850], [700, 850]]],
      'J': [[[800, 150], [800, 800], [200, 800], [150, 650]]],
      'K': [[[150, 100], [150, 900]], [[150, 500], [850, 150]], [[150, 500], [850, 900]]],
      'L': [[[150, 150], [150, 850], [850, 850]]],
      'M': [[[100, 900], [150, 100], [500, 500], [850, 100], [900, 900]]],
      'N': [[[150, 900], [150, 150], [850, 850], [850, 150]]],
      'O': [[[200, 200], [800, 200], [800, 800], [200, 800], [200, 200]]],
      'P': [[[150, 900], [150, 150], [850, 150], [850, 500], [150, 500]]],
      'Q': [[[250, 250], [750, 250], [750, 750], [250, 750], [250, 250]], [[550, 550], [900, 900]]],
      'R': [[[150, 900], [150, 150], [850, 150], [850, 500], [150, 500]], [[450, 500], [850, 900]]],
      'S': [[[850, 250], [250, 150], [150, 500], [850, 550], [850, 850], [150, 850]]],
      'T': [[[150, 150], [850, 150]], [[500, 150], [500, 850]]],
      'U': [[[150, 150], [150, 850], [850, 850], [850, 150]]],
      'V': [[[150, 150], [500, 850], [850, 150]]],
      'W': [[[100, 150], [300, 850], [500, 450], [700, 850], [900, 150]]],
      'X': [[[150, 150], [850, 850]], [[850, 150], [150, 850]]],
      'Y': [[[150, 150], [500, 500], [850, 150]], [[500, 500], [500, 850]]],
      'Z': [[[150, 150], [850, 150], [150, 850], [850, 850]]],
      '1': [[[300, 350], [500, 150], [500, 850]]],
      '2': [[[150, 300], [850, 200], [800, 500], [150, 850], [850, 850]]],
      '3': [[[150, 250], [800, 200], [450, 450], [800, 550], [750, 850], [150, 800]]],
      '4': [[[700, 850], [700, 150], [150, 650], [900, 650]]],
      '5': [[[800, 150], [150, 150], [150, 500], [800, 500], [800, 850], [150, 850]]],
      '6': [[[800, 200], [150, 550], [150, 850], [850, 850], [850, 550], [150, 550]]],
      '7': [[[150, 150], [850, 150], [450, 850]]],
      '8': [[[500, 500], [200, 300], [500, 150], [800, 300], [500, 500], [200, 750], [500, 850], [800, 750], [500, 500]]],
      '9': [[[150, 550], [150, 150], [850, 150], [850, 850], [200, 850]]],
      '0': [[[250, 150], [750, 150], [750, 850], [250, 850], [250, 150]]],
      'Ä': [[[150, 900], [500, 250], [850, 900]], [[250, 650], [750, 650]], [[350, 100], [355, 100]], [[650, 100], [655, 100]]],
      'Ö': [[[250, 250], [750, 250], [750, 850], [250, 850], [250, 250]], [[350, 100], [355, 100]], [[650, 100], [655, 100]]],
      'Ü': [[[150, 250], [150, 850], [850, 850], [850, 250]], [[350, 100], [355, 100]], [[650, 100], [655, 100]]],
      'ß': [[[150, 900], [150, 150], [750, 150], [750, 500], [150, 500], [800, 650], [800, 900], [150, 900]]],
      '!': [[[500, 150], [500, 750]], [[500, 900], [505, 900]]],
      '?': [[[200, 300], [800, 200], [800, 500], [500, 550], [500, 750]], [[500, 900], [505, 900]]],
      '.': [[[500, 900], [505, 900]]],
      ':': [[[500, 500], [505, 500]], [[500, 900], [505, 900]]],
      ' ': []
    };

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function generateGlyph(char, algo, chaos, weight, subdiv) {
      const p = new opentype.Path();
      const lookup = char.toUpperCase();
      const skelSegments = skeletons[lookup] || skeletons['O'];

      if (skelSegments.length === 0) {
        return p;
      }

      const adaptiveChaos = chaos * Math.min(1.0, (weight / 15) + 0.5);
      const jitter = (val, c = adaptiveChaos) => val + (rng() - 0.5) * c * 5;
      const w = weight;

      skelSegments.forEach((segment) => {
        if (segment.length < 2) {
          return;
        }

        const points = [];
        for (let i = 0; i < segment.length - 1; i += 1) {
          for (let s = 0; s <= subdiv; s += 1) {
            const t = s / subdiv;
            points.push([
              lerp(segment[i][0], segment[i + 1][0], t),
              lerp(segment[i][1], segment[i + 1][1], t)
            ]);
          }
        }

        if (algo === 'ballpoint') {
          for (let n = 0; n < 2; n += 1) {
            p.moveTo(jitter(points[0][0], adaptiveChaos * 0.3), jitter(points[0][1], adaptiveChaos * 0.3));
            points.forEach((pt) => {
              const xj = jitter(pt[0], adaptiveChaos * 0.3) + (n * (w / 10));
              const yj = jitter(pt[1], adaptiveChaos * 0.3) + (n * (w / 10));
              p.lineTo(xj, yj);
              if (rng() > 0.97) {
                const blobR = (w / 4) * (0.5 + rng());
                p.moveTo(xj - blobR, yj);
                p.quadraticCurveTo(xj - blobR, yj - blobR, xj, yj - blobR);
                p.quadraticCurveTo(xj + blobR, yj - blobR, xj + blobR, yj);
                p.quadraticCurveTo(xj + blobR, yj + blobR, xj, yj + blobR);
                p.quadraticCurveTo(xj - blobR, yj + blobR, xj - blobR, yj);
                p.moveTo(xj, yj);
              }
            });
          }
        } else if (algo === 'handwriting') {
          p.moveTo(jitter(points[0][0], adaptiveChaos * 0.4), jitter(points[0][1], adaptiveChaos * 0.4));
          points.forEach((pt) => p.lineTo(jitter(pt[0], adaptiveChaos * 0.4), jitter(pt[1], adaptiveChaos * 0.4)));
          for (let i = points.length - 1; i >= 0; i -= 1) {
            p.lineTo(jitter(points[i][0], adaptiveChaos * 0.4) + w / 4, jitter(points[i][1], adaptiveChaos * 0.4) + w / 4);
          }
          p.closePath();
        } else if (algo === 'scribble') {
          for (let pass = 0; pass < 2; pass += 1) {
            p.moveTo(jitter(points[0][0], adaptiveChaos * 1.5), jitter(points[0][1], adaptiveChaos * 1.5));
            points.forEach((pt) => {
              const xj = jitter(pt[0], adaptiveChaos * 1.2);
              const yj = jitter(pt[1], adaptiveChaos * 1.2);
              p.lineTo(xj, yj);
              if (rng() > 0.88) {
                p.quadraticCurveTo(xj + 15, yj - 15, xj + 3, yj + 3);
                p.moveTo(xj, yj);
              }
            });
          }
        } else if (algo === 'brutalist') {
          for (let i = 0; i < points.length - 1; i += 1) {
            const x1 = jitter(points[i][0]);
            const y1 = jitter(points[i][1]);
            const x2 = jitter(points[i + 1][0]);
            const y2 = jitter(points[i + 1][1]);
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const nx = -dy / len * (w / 1.5);
            const ny = dx / len * (w / 1.5);
            p.moveTo(x1 - nx, y1 - ny);
            p.lineTo(x1 + nx, y1 + ny);
            p.lineTo(x2 + nx, y2 + ny);
            p.lineTo(x2 - nx, y2 - ny);
            p.closePath();
          }
        } else if (algo === 'dots') {
          points.forEach((pt) => {
            const x = jitter(pt[0]);
            const y = jitter(pt[1]);
            const r = w / 2.5;
            p.moveTo(x - r, y);
            p.quadraticCurveTo(x - r, y - r, x, y - r);
            p.quadraticCurveTo(x + r, y - r, x + r, y);
            p.quadraticCurveTo(x + r, y + r, x, y + r);
            p.quadraticCurveTo(x - r, y + r, x - r, y);
            p.closePath();
          });
        } else if (algo === 'inkbleed') {
          points.forEach((pt) => {
            const r = (w / 1.5) * (0.6 + rng() * 0.8);
            const x = jitter(pt[0], adaptiveChaos * 0.1);
            const y = jitter(pt[1], adaptiveChaos * 0.1);
            p.moveTo(x - r, y);
            p.quadraticCurveTo(x - r, y - r, x, y - r);
            p.quadraticCurveTo(x + r, y - r, x + r, y);
            p.quadraticCurveTo(x + r, y + r, x, y + r);
            p.quadraticCurveTo(x - r, y + r, x - r, y);
            p.closePath();
          });
        } else if (algo === 'wireframe') {
          points.forEach((pt, idx) => {
            const x = jitter(pt[0]);
            const y = jitter(pt[1]);
            points.slice(idx + 1, idx + 3).forEach((other) => {
              p.moveTo(x, y);
              p.lineTo(jitter(other[0]), jitter(other[1]));
              p.lineTo(jitter(other[0]) + 1, jitter(other[1]) + 1);
              p.closePath();
            });
          });
        } else if (algo === 'sketch') {
          for (let n = 0; n < 3; n += 1) {
            p.moveTo(jitter(points[0][0], adaptiveChaos * 0.6), jitter(points[0][1], adaptiveChaos * 0.6));
            for (let i = 1; i < points.length; i += 1) {
              p.lineTo(jitter(points[i][0], adaptiveChaos * 0.6), jitter(points[i][1], adaptiveChaos * 0.6));
            }
          }
        } else {
          p.moveTo(jitter(points[0][0]), jitter(points[0][1]));
          for (let i = 1; i < points.length; i += 1) {
            const x = jitter(points[i][0]);
            const y = jitter(points[i][1]);
            if (algo === 'organic') {
              const cx = (jitter(points[i - 1][0]) + x) / 2 + (rng() - 0.5) * adaptiveChaos * 5;
              const cy = (jitter(points[i - 1][1]) + y) / 2 + (rng() - 0.5) * adaptiveChaos * 5;
              p.quadraticCurveTo(cx, cy, x, y);
            } else {
              p.lineTo(x, y);
            }
          }
          if (algo !== 'dots' && algo !== 'inkbleed' && algo !== 'ballpoint' && algo !== 'wireframe') {
            for (let i = points.length - 1; i >= 0; i -= 1) {
              p.lineTo(jitter(points[i][0]) + w / 3, jitter(points[i][1]) + w / 3);
            }
            p.closePath();
          }
        }
      });

      return p;
    }

    async function createFont() {
      const algo = document.getElementById('algoSelect').value;
      const chaos = Number.parseInt(document.getElementById('chaosRange').value, 10);
      const weight = Number.parseInt(document.getElementById('weightRange').value, 10);
      const subdiv = Number.parseInt(document.getElementById('subdivRange').value, 10);
      const spacing = Number.parseInt(document.getElementById('spacingRange').value, 10);
      const seed = Number.parseInt(document.getElementById('seedInput').value, 10);

      rng = mulberry32(seed);

      const glyphs = [];
      glyphs.push(new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: 600, path: new opentype.Path() }));

      alphabet.split('').forEach((char) => {
        const path = generateGlyph(char, algo, chaos, weight, subdiv);
        path.commands.forEach((cmd) => {
          if (cmd.y !== undefined) cmd.y = 1000 - cmd.y;
          if (cmd.y1 !== undefined) cmd.y1 = 1000 - cmd.y1;
          if (cmd.y2 !== undefined) cmd.y2 = 1000 - cmd.y2;
        });
        glyphs.push(new opentype.Glyph({
          name: char,
          unicode: char.charCodeAt(0),
          advanceWidth: spacing,
          path
        }));
      });

      currentFont = new opentype.Font({
        familyName: 'X-Gen-' + seed,
        styleName: algo.charAt(0).toUpperCase() + algo.slice(1),
        unitsPerEm: 1000,
        ascender: 900,
        descender: -100,
        glyphs
      });

      updatePreview();
    }

    function updatePreview() {
      if (!currentFont) {
        return;
      }

      const previewText = document.getElementById('previewInput').value || 'VORSCHAU';
      const buffer = currentFont.toArrayBuffer();
      const nextUrl = URL.createObjectURL(new Blob([buffer], { type: 'font/opentype' }));
      const fontName = 'GenFont_' + Date.now();
      const style = document.createElement('style');
      style.textContent = `@font-face { font-family: "${fontName}"; src: url("${nextUrl}"); } #textPreview { font-family: "${fontName}"; }`;

      const oldStyle = document.getElementById('font-style');
      if (oldStyle) {
        oldStyle.remove();
      }
      if (activeFontUrl) {
        URL.revokeObjectURL(activeFontUrl);
      }

      activeFontUrl = nextUrl;
      style.id = 'font-style';
      document.head.appendChild(style);
      document.getElementById('textPreview').innerText = previewText;
    }

    ['chaosRange', 'weightRange', 'subdivRange', 'spacingRange'].forEach((id) => {
      document.getElementById(id).addEventListener('input', (event) => {
        document.getElementById('val-' + id.replace('Range', '')).innerText = event.target.value;
        createFont();
      });
    });

    document.getElementById('algoSelect').addEventListener('change', createFont);
    document.getElementById('seedInput').addEventListener('change', createFont);
    document.getElementById('generateBtn').addEventListener('click', createFont);
    document.getElementById('randomSeedBtn').addEventListener('click', () => {
      document.getElementById('seedInput').value = Math.floor(Math.random() * 100000);
      createFont();
    });
    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!currentFont) {
        return;
      }
      const algo = document.getElementById('algoSelect').value;
      const seed = document.getElementById('seedInput').value;
      currentFont.download(`x-font-lab-${algo}-${seed}.otf`);
    });
    document.getElementById('previewInput').addEventListener('input', updatePreview);
    document.getElementById('textPreview').addEventListener('input', (event) => {
      document.getElementById('previewInput').value = event.currentTarget.innerText.replace(/\n/g, ' ');
    });

    window.addEventListener('beforeunload', () => {
      if (activeFontUrl) {
        URL.revokeObjectURL(activeFontUrl);
      }
    });

    window.onload = createFont;
  </script>
  <script type="module" src="/src/i18n.js"></script>
</body>
</html>
